<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Profil & Portofolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
        }

        /* Container Utama */
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        /* Header & Foto Profil */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        /* 
          FOTO PROFIL PERSEGI PANJANG (LANDSCAPE):
          - Lebar (width) dibuat besar: 280px
          - Tinggi (height) dibuat lebih pendek: 160px
          - Lebar ke kiri dan ke kanan
        */
        .profile-img {
            width: 280px;
            height: 160px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #6366f1;
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.25);
        }

        h1 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 8px;
        }

        p.bio {
            color: #64748b;
            font-size: 1rem;
        }

        /* Banner / Hero Image */
        .hero-banner {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        /* Judul Seksi */
        .section-title {
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        /* Galeri Gambar Grid (3 Kolom) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .gallery-caption {
            padding: 12px;
            background: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            text-align: center;
        }

        /* Tombol Aksi (Links) */
        .links-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            background-color: #6366f1;
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #4f46e5;
        }

        .btn-outline {
            background-color: transparent;
            color: #6366f1;
            border: 2px solid #6366f1;
        }

        .btn-outline:hover {
            background-color: #6366f1;
            color: white;
        }

        /* Footer */
        <footer>
            &copy; 2026 Website Saya. Semua Hak Cipta Dilindungi.
        </footer>
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Header Profil -->
        <div class="header">
            <!-- Foto Profil: Persegi Panjang Melebar ke Kiri & Kanan -->
            <img src="https://scontent.cdninstagram.com/v/t51.82787-19/797842577_18093739028270107_7375560405711460302_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=108&ccb=7-5&_nc_sid=f7ccc5&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy42NDAuQzMifQ%3D%3D&_nc_ohc=U0Vjw5vVyMAQ7kNvwGNJXmO&_nc_oc=AdruVIl-DZ29wnvCbVEq2MV9fNxr2oNywDviyNEBLcmjI1s1zkSQroUuDyUeffcjAPXLneISNgAKGirWrYQF0eWs&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_gid=VXGUDClq091oHR8kTsnB8Q&_nc_ss=7b689&oh=00_AQPYc3ABZuGHHhdZ5YKRZlhlJ9euT18lIJd7wxF31cokiw&oe=6AD12475" alt="Foto Profil" class="profile-img">
            <h1>CLAURUS</h1>
            <p class="bio">a day in claurus</p>
        </div>

        <!-- 2. Banner Utama -->
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1200&h=400&fit=crop" alt="Banner Utama" class="hero-banner">

        <!-- 3. Seksi Galeri Karya / Produk -->
        <h2 class="section-title">Galeri Portofolio</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=500&h=300&fit=crop" alt="Proyek 1">
                <div class="gallery-caption">Desain Web & Dashboard</div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=500&h=300&fit=crop" alt="Proyek 2">
                <div class="gallery-caption">Aplikasi Mobile</div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=500&h=300&fit=crop" alt="Proyek 3">
                <div class="gallery-caption">Pengembangan Kode</div>
            </div>
        </div>

        <!-- 4. Tombol Kontak -->
        <div class="links-container">
            <a href="https://www.instagram.com/ourstoryclarus?srtk=MWRsb3dlNzA5czBzcA==" target="_blank" class="btn">Kunjungi Instagram</a>
            <a href="mailto:email@domain.com" class="btn btn-outline">Kirim Email</a>
        </div>

        <!-- 5. Footer -->
        <footer>
            &copy; 2026 Website Saya. Semua Hak Cipta Dilindungi.
        </footer>
    </div>

</body>
</html>
